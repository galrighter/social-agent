name: Import n8n Workflows

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import all workflows to n8n
        run: |
          N8N_URL="https://n8n-rightek.onrender.com/api/v1/workflows"
          API_KEY="${{ secrets.N8N_API_KEY }}"

          for file in \
            social-agent/contact-sync/n8n_morning_to_airtable.json \
            social-agent/contact-sync/n8n_google_to_airtable.json \
            social-agent/contact-sync/n8n_airtable_to_google.json
          do
            NAME=$(jq -r '.name' "$file")
            echo "=== Importing: $NAME ==="

            # Strip fields n8n API doesn't accept (meta, tags)
            PAYLOAD=$(jq '{name, nodes, connections, settings}' "$file")

            RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$N8N_URL" \
              -H "X-N8N-API-KEY: $API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP_STATUS://')
            BODY=$(echo "$RESP" | sed '$d')
            echo "$BODY"
            echo "Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
              echo "ERROR: Failed to import $NAME"
              exit 1
            fi
            echo ""
          done
          echo "All workflows imported successfully!"
