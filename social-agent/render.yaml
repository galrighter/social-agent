services:
  - type: worker
    name: social-media-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    envVars:
      - key: AIRTABLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false
      - key: IG_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PUBLISH_HOUR_UTC
        value: "6"
      - key: SUMMARIZE_AFTER_N_FEEDBACKS
        value: "10"
      # ── encoding — fixes Hebrew in logs ──
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: LANG
        value: "C.UTF-8"
      - key: LC_ALL
        value: "C.UTF-8"
