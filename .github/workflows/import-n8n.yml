name: Import n8n Workflows

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import Morning → Airtable workflow
        run: |
          echo "=== Morning → Airtable ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://n8n-rightek.onrender.com/api/v1/workflows" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @social-agent/contact-sync/n8n_morning_to_airtable.json)
          echo "$RESP"

      - name: Import Google → Airtable workflow
        run: |
          echo "=== Google → Airtable ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://n8n-rightek.onrender.com/api/v1/workflows" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @social-agent/contact-sync/n8n_google_to_airtable.json)
          echo "$RESP"

      - name: Import Airtable → Google workflow
        run: |
          echo "=== Airtable → Google ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://n8n-rightek.onrender.com/api/v1/workflows" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @social-agent/contact-sync/n8n_airtable_to_google.json)
          echo "$RESP"
