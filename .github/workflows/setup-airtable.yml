name: Setup Airtable Contacts Table

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: true
        default: 'add_fields'
        type: choice
        options:
          - add_fields
          - setup_airtable

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run selected script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_TOKEN1 }}
        run: python social-agent/contact-sync/${{ inputs.script }}.py
